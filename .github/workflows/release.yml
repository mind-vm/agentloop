# Builds and publishes CLI binaries when a version tag is pushed.
#
# A previous workflow of this name was removed because it did not do this:
# it triggered on v* tags and then only ran build, vet and test, producing
# no release at all. That work now lives in ci.yml, where it belongs — on
# every push — and this one publishes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # ci.yml gates every push, but a tag can be placed on any commit,
      # including one that never went through a pull request. Re-running the
      # suite here is a few seconds against publishing a broken binary under
      # a version number that cannot be taken back.
      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Left to itself GoReleaser infers the version from the nearest
          # reachable tag, and this repository has tags that are not releases
          # of this command: browser/chrome carries its own, because a Go
          # submodule has to. On a tag push the inference is right, but a
          # workflow_dispatch from a branch would reach browser/chrome/v0.4.0
          # and build `agentloop_browser/chrome/v0.4.0_linux_amd64.tar.gz`.
          # Naming the ref removes the guess. Dispatching from a branch now
          # fails on a non-semver version instead, which is the better of the
          # two outcomes.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
